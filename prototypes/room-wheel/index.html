<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PFT Room Wheel</title>
<style>
  :root {
    --bg: #1a1020;
    --bg2: #2b1530;
    --panel: rgba(255, 255, 255, 0.06);
    --panel-border: rgba(255, 255, 255, 0.12);
    --text: #fff4e6;
    --muted: #d9bfa6;
    --sun: #ffb52e;
    --sun-hot: #ff6a2a;
    --seg-a: #ffcf5c;
    --seg-b: #ff9944;
    --seg-c: #f2665a;
    --seg-d: #c94f7c;
    --seg-text: #2a0f1a;
    --focus: #7fe3ff;
    --danger: #ff5a4f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: clip; }
  body {
    min-height: 100vh;
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: radial-gradient(1200px 600px at 50% -10%, #5a2534 0%, var(--bg2) 45%, var(--bg) 100%);
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px 40px;
  }
  h1 { margin: 0; font-size: clamp(1.4rem, 4vw, 2rem); letter-spacing: .02em; }
  .sub { margin: 4px 0 20px; color: var(--muted); text-align: center; }
  .layout {
    width: 100%; max-width: 980px;
    display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start;
  }
  @media (max-width: 760px) { .layout { grid-template-columns: minmax(0, 1fr); } }

  /* Wheel */
  .stage { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .wheel-wrap { position: relative; width: min(460px, 100%); aspect-ratio: 1; }
  .wheel-wrap::before { /* sun halo */
    content: ""; position: absolute; inset: -6%; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,181,46,.35) 0%, rgba(255,106,42,.12) 55%, transparent 70%);
    filter: blur(6px); transition: transform .6s ease;
  }
  .wheel-wrap.spinning::before { animation: pulse 0.9s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform: scale(1.06); } }
  #wheel { position: relative; width: 100%; height: 100%; display: block; will-change: transform; }
  #wheel .seg-label { font-weight: 800; font-size: 11px; fill: var(--seg-text); }
  .hub { fill: var(--sun); stroke: #fff2c8; stroke-width: 2; }
  .pointer {
    position: absolute; left: 50%; top: -4px; transform: translateX(-50%);
    width: 0; height: 0; z-index: 2;
    border-left: 16px solid transparent; border-right: 16px solid transparent;
    border-top: 30px solid #fff4e6; filter: drop-shadow(0 3px 3px rgba(0,0,0,.5));
  }
  .pointer.tick { animation: tick .12s ease-out; }
  @keyframes tick { 50% { transform: translateX(-50%) rotate(-12deg); } }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
  button {
    font: inherit; font-weight: 700; cursor: pointer; border-radius: 999px;
    border: 1px solid var(--panel-border); background: var(--panel); color: var(--text);
    padding: 10px 18px;
  }
  button:hover:not(:disabled) { background: rgba(255,255,255,.12); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary {
    background: linear-gradient(180deg, var(--sun), var(--sun-hot)); color: #2a0f1a; border: 0;
    padding: 14px 32px; font-size: 1.15rem; box-shadow: 0 6px 24px rgba(255,106,42,.4);
  }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); background: linear-gradient(180deg, var(--sun), var(--sun-hot)); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  label.check { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--sun); }
  .hint { color: var(--muted); font-size: .85rem; text-align: center; margin: 0; }
  kbd {
    font: 600 .8em ui-monospace, monospace; padding: 1px 6px; border-radius: 4px;
    border: 1px solid var(--panel-border); background: rgba(0,0,0,.25);
  }

  /* Result + countdown */
  .result {
    width: min(460px, 100%); min-height: 120px; text-align: center;
    border-radius: 16px; padding: 16px; background: var(--panel); border: 1px solid var(--panel-border);
  }
  .result .objective { font-size: 1.2rem; font-weight: 700; margin: 0 0 8px; }
  .result .room { color: var(--sun); font-size: 1.5em; }
  .result.reveal { animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(.94); opacity: .4; } }
  .countdown { display: flex; align-items: center; gap: 12px; justify-content: center; }
  .count-num { font: 800 2rem ui-monospace, monospace; min-width: 3ch; }
  .bar { flex: 1; max-width: 260px; height: 10px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--sun-hot), var(--sun)); transform-origin: left; }
  .sun-up { color: var(--danger); font-weight: 800; letter-spacing: .03em; }
  .error { color: var(--danger); font-weight: 700; }

  /* Side panel */
  aside { border-radius: 16px; padding: 16px; background: var(--panel); border: 1px solid var(--panel-border); }
  aside h2 { font-size: 1rem; margin: 0 0 8px; }
  aside section + section { margin-top: 18px; }
  fieldset { border: 0; padding: 0; margin: 0; }
  legend { font-weight: 700; margin-bottom: 6px; padding: 0; }
  .rooms { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
  select, input[type=range] { width: 100%; font: inherit; }
  select { background: #2b1530; color: var(--text); border: 1px solid var(--panel-border); border-radius: 8px; padding: 6px; }
  input[type=range] { accent-color: var(--sun); }
  .small { font-size: .85rem; color: var(--muted); }
  #log { margin: 0; padding: 0; list-style: none; max-height: 160px; overflow: auto; font: .75rem/1.35 ui-monospace, monospace; color: var(--muted); overflow-wrap: anywhere; }
  #log li + li { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--panel-border); }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
  <h1>☀️ Which room are you running to?</h1>
  <p class="sub">PFT sun-survival · classroom wheel prototype · placeholder room numbers</p>

  <div class="layout">
    <main class="stage">
      <div class="wheel-wrap" id="wheelWrap">
        <div class="pointer" id="pointer" aria-hidden="true"></div>
        <svg id="wheel" viewBox="-100 -100 200 200" role="img" aria-label="Classroom wheel"></svg>
      </div>

      <div class="controls">
        <button id="spinBtn" class="primary" type="button" autofocus>Spin</button>
        <button id="skipNowBtn" type="button" hidden>Skip ⏭</button>
        <label class="check"><input id="skipAnim" type="checkbox"> Skip animation</label>
      </div>
      <p class="hint"><kbd>Space</kbd> / <kbd>Enter</kbd> spin · <kbd>Esc</kbd> skip to result · <kbd>R</kbd> new round</p>

      <div class="result" id="result" aria-live="polite">
        <p class="small">Spin to get your target classroom.</p>
      </div>
    </main>

    <aside aria-label="Round settings">
      <section>
        <fieldset>
          <legend>Eligible rooms</legend>
          <div class="rooms" id="roomList"></div>
        </fieldset>
      </section>
      <section>
        <label for="spawnSel"><strong>Spawn location</strong></label>
        <select id="spawnSel"></select>
        <p class="small">A room you spawn in is never assigned.</p>
      </section>
      <section>
        <label for="countdown"><strong>Countdown: <span id="countdownVal">25</span>s</strong></label>
        <input id="countdown" type="range" min="20" max="30" step="1" value="25">
      </section>
      <section>
        <h2>Handoff events</h2>
        <ol id="log" aria-label="Event log"></ol>
      </section>
    </aside>
  </div>

  <div class="sr-only" id="announcer" aria-live="assertive"></div>

  <script src="wheel-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
